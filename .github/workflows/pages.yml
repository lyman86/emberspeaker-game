name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import the uploaded project once
        if: ${{ hashFiles('package.json') == '' }}
        env:
          ARCHIVE: ${{ runner.temp }}/emberspeaker-source.zip
        run: |
          curl --fail --location --retry 3 --output "$ARCHIVE" https://github.com/lyman86/emberspeaker-game/releases/download/v0.7.0/emberspeaker-source-v7.zip
          echo "0835cac0956187534d43d270225c94b01dd189884cae9133f806d3f8a13657d9  $ARCHIVE" | sha256sum --check
          unzip -oq "$ARCHIVE" -d .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import complete Emberspeaker source and assets'
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
